schema_version = "1.3"
artifacts = ["/logs/agent/trajectory.json", "/logs/agent/trajectory.txt"]

[task]
name = "forge/slack-task-1"
description = "Interconnected operations: route one message to an existing DM then the group containing the same person, edit your own thread reply beside a look-alike author's reply, and reply to threads with dynamic bodies naming each thread's last commenter (one has an accented name)."
authors = []
keywords = ["slack", "sqlite", "tool-use", "deterministic", "harbor"]

[metadata]
difficulty_explanation = "Deterministic service task requiring entity-type routing (DM vs group vs channel), reuse of existing chats, editing the correct own message beside a look-alike author, and observation-dependent reply bodies (last commenter per thread, including an accented display name); verified via SQLite state and trajectory checks."
category = "agent-environment"
environment_service = "slack"
database = "sqlite"

[verifier]
timeout_sec = 120.0
environment_mode = "separate"
user = "root"

[agent]
timeout_sec = 600.0
user = "agent"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048

[verifier.environment.env]
PYTHONPATH = "/opt/fleet"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 4096
mcp_servers = []

[environment.env]
PYTHONPATH = "/opt/fleet"

[solution.env]
