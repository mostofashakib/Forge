# The agent runs in `main`; the task tracker runs in `tasks`. They share nothing
# but a directory holding two Unix sockets, so the agent has no filesystem path
# to workspace state and no network dependency on it either -- which keeps the
# boundary intact under Harbor's no-network egress policy.
services:
  main:
    build:
      # The task root, so the image can ship the grading-side verifier package
      # alongside the answer key. Nothing outside `environment/` is copied into
      # the agent stage.
      context: ..
      dockerfile: environment/Dockerfile
      target: agent
    volumes:
      - tasks-ipc:/run/tasks
    depends_on:
      tasks:
        condition: service_healthy

  tasks:
    build:
      context: ..
      dockerfile: environment/Dockerfile
      target: world
    volumes:
      - tasks-ipc:/run/tasks
    healthcheck:
      test: ["CMD", "python3", "-m", "task_sim.admin_cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

volumes:
  tasks-ipc:
