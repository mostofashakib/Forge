[project]
name = "forge-rl-example-tasks"
version = "0.1.0"
description = "Deterministic RL environment examples for evaluating agent tool use."
requires-python = ">=3.12"
dependencies = [
  "harbor-rewardkit>=0.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleet"]
