# Which reward contract an experiment grades under. Both VerifierComposer and
# TieredRewardEngine resolve this same name, so a run's output always says how
# it was graded.
#
#   full_layered_deterministic  all four layers, weighted partial credit
#   binary_final_state          final-state checks plus the veto; reward is 0 or 1
#
# The same episode must produce the same number every time it is graded, by
# anyone, offline -- that is what makes a score evidence rather than an
# anecdote, and it is what lets a score table say what a right step, a wrong
# step or a side effect is worth.
reward_preset: full_layered_deterministic
