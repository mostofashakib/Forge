schema_version = "1.4"
artifacts = [
  # Both Claude Code and the deterministic Oracle emit ATIF trajectory.json in
  # this directory. Session transcripts are excluded because the trajectory
  # already carries the model interaction a reviewer needs.
  { source = "/logs/agent", exclude = ["sessions"] },
  { source = "/var/lib/slack/state-export.json", service = "slack" },
]

[task]
name = "collinear-candidate/slack-incident-reconciliation"
version = "9.0.0"
description = "Drive a live enterprise cutover through staged reviews, timing clarification, deep historical evidence, customer workflow verification, rollback validation, bridge coverage, and a rehearsal that invalidates earlier readiness evidence before reporting the terminal state."
authors = [{ name = "Mostofa Shakib" }]
keywords = ["slack", "long-horizon", "state-tracking", "evidence-reconciliation", "stale-state", "ownership-handoff", "verification", "threads", "sqlite", "harbor", "rl-environment"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Requires navigating more than 1,600 messages across five high-volume channels, retrieving prerequisite evidence over 200 top-level messages deep, performing eight ordered review decisions, resolving a genuine scheduling ambiguity, tracking coverage, discovering rollback as an omitted dependency, and replanning when rehearsal invalidates an earlier rollback green."
category = "agent-environment"
environment_service = "slack"
database = "sqlite"
originality = "Net-new long-horizon migration-readiness scenario for this exercise."

[verifier]
timeout_sec = 180.0
environment_mode = "shared"
user = "root"

# Snapshot the workspace from inside the environment before teardown, so the
# graded state is preserved as an artifact independently of the live socket.
[[verifier.collect]]
command = "python3 -m slack_sim.admin_cli export_state --out /var/lib/slack/state-export.json"
service = "slack"
timeout_sec = 60.0
user = "slackd"

[agent]
timeout_sec = 1200.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096

# Harbor registers this with whichever agent runs the task, so the Slack
# workspace arrives as native tools carrying their own schemas before the first
# turn. The prompt is Daniel's message and nothing else: finding out what the
# workspace contains is the task, but discovering that it exists is not.
#
# stdio, not http: the environment runs with no network, and a subprocess on
# the agent's side of the socket boundary needs none. The server is a client of
# `agent.sock`; workspace state stays in its own container.
[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/slack-mcp"
