# Test every change. On main, build the images, deploy them to the VM over
# Tailscale, prove the whole system still works, and roll back on its own if not.
#
# Secrets: TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET only. Provider keys, the scrub
# key, backup keys, and Healthchecks.io URLs live in the VM's env file and never
# enter GitHub.
# Repository variables: FORGE_PUBLIC_HOST (the VM's tailnet name), and optionally
# FORGE_VM_USER (default ubuntu) and FORGE_VM_PLATFORM (default linux/arm64).
name: deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ vars.FORGE_VM_PLATFORM || 'linux/arm64' }}
      REPO: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/forge/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ env.REPO }}/forge-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: ${{ env.PLATFORM }}
          push: true
          build-args: NEXT_PUBLIC_API_URL=https://${{ vars.FORGE_PUBLIC_HOST }}
          tags: ${{ env.REPO }}/forge-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.sha }}
      VM: ${{ vars.FORGE_VM_USER || 'ubuntu' }}@forge
      BASE: https://${{ vars.FORGE_PUBLIC_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Record the running release and back up the database
        id: before
        run: |
          previous=$(ssh -o StrictHostKeyChecking=accept-new "$VM" \
            "grep '^FORGE_IMAGE_TAG=' /opt/forge/deploy/.env.production | cut -d= -f2")
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          # Schema changes apply on startup, so keep a copy to roll back to.
          ssh "$VM" "cd /opt/forge && docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production \
            exec -T api sqlite3 /data/forge.db \".backup /data/pre-deploy.db\""

      - name: Deploy this commit
        run: |
          # The deploy files come from this commit. The VM's env file stays where it is.
          scp -r deploy/docker-compose.yml deploy/Caddyfile deploy/litestream.yml deploy/backup.sh \
            deploy/heartbeat.sh deploy/wiring-check.sh deploy/smoke.sh "$VM:/opt/forge/deploy/"
          # $SHA expands here on the runner on purpose, before the command goes over SSH.
          # shellcheck disable=SC2029
          ssh "$VM" "cd /opt/forge && sed -i 's/^FORGE_IMAGE_TAG=.*/FORGE_IMAGE_TAG=$SHA/' deploy/.env.production \
            && docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production pull \
            && docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --wait --wait-timeout 300"

      - name: Prove the system works
        id: verify
        run: |
          ssh "$VM" "/opt/forge/deploy/wiring-check.sh /opt/forge/deploy/.env.production"
          deploy/smoke.sh "$BASE"

      - name: Roll back
        if: failure() && steps.before.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.before.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # $PREVIOUS, $SHA, and $RUN_URL expand here on the runner on purpose.
          # shellcheck disable=SC2029
          ssh "$VM" "cd /opt/forge && C='docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production' \
            && sed -i 's/^FORGE_IMAGE_TAG=.*/FORGE_IMAGE_TAG=$PREVIOUS/' deploy/.env.production \
            && \$C stop api worker litestream \
            && \$C run --rm --no-deps -T --entrypoint sh api -c 'cp /data/pre-deploy.db /data/forge.db && rm -f /data/forge.db-wal /data/forge.db-shm && rm -rf /data/.forge.db-litestream' \
            && \$C up -d --wait --wait-timeout 300"
          # shellcheck disable=SC2029
          ssh "$VM" "url=\$(grep '^FORGE_HC_HEALTH_URL=' /opt/forge/deploy/.env.production | cut -d= -f2) \
            && curl -fsS -m 10 --data-raw 'deploy of $SHA failed, rolled back to $PREVIOUS: $RUN_URL' \"\$url/fail\""
          ssh "$VM" "/opt/forge/deploy/wiring-check.sh /opt/forge/deploy/.env.production"
          deploy/smoke.sh "$BASE"
          exit 1
