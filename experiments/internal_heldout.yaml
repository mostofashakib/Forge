# One declarative internal-generalization run. Replace names with generated envs.
train_envs:
  - email_train
  - crm_train
heldout_envs:
  - calendar_heldout
reward_preset: full_layered_partial
base_model: Qwen/Qwen2.5-3B-Instruct
seeds: [0, 1, 2]
determinism_repeats: 2
# Refuse LLM-graded runs judged by the generating model family.
require_grader_independence: true
# Fail the run rather than publish a pass rate from a gutted denominator.
max_abstention_rate: 0.2
